name: Build prototypes and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workbook builders
        run: python -m pip install -e ".[excel,vba]"

      - name: Build Excel workbooks
        run: |
          python scripts/build_excel_prototype.py
          python scripts/build_excel_vba_prototype.py
          python scripts/build_clinical_logic_review.py

      - name: Run automated tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          node --test tests/browser_calculations.test.js

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -R prototype/. _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
