[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-cachexia-poc"
version = "0.1.0"
description = "Research-only synthetic cachexia risk proof of concept"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]
vba = [
    "pyOpenVBA==3.4.0; python_version >= '3.10'",
    "xlsxwriter>=3.2.9,<4; python_version >= '3.10'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
